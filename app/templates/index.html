<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelCo - Flipt Demo</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;margin:0}
header{background:#14213d;color:white;padding:28px}
main{max-width:800px;margin:30px auto;padding:0 18px}
.card{background:white;border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 4px 18px #0001}
button{background:#2463eb;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
.status{font-weight:bold;padding:8px 12px;border-radius:20px;display:inline-block}
.on{background:#d9fbe5;color:#146c43}.off{background:#fff0cc;color:#8a5b00}
.error{background:#ffe0e0;color:#a00000}
</style>
</head>
<body>
<header>
<h1>TravelCo</h1>
<p>Feature flag demonstration powered by Flipt v2</p>
</header>
<main>
<section class="card">
<h2 id="title">Checking Flipt...</h2>
<p id="description">Evaluating the new-checkout feature flag.</p>
<p><span id="status" class="status">Loading</span></p>
<button onclick="evaluateFlag()">Evaluate flag again</button>
<p>Flag: <code>new-checkout</code> | Environment: <code>demo</code></p>
</section>
<section class="card">
<h2>Choose your holiday</h2>
<p>Paris weekend · Mountain escape · Beach holiday</p>
<p id="checkout">Loading checkout experience...</p>
</section>
<section class="card">
<h3>Evaluation details</h3>
<pre id="details"></pre>
</section>
</main>
<script>
async function evaluateFlag(){
  const title=document.getElementById("title");
  const status=document.getElementById("status");
  title.textContent="Checking Flipt...";
  try{
    const r=await fetch("/api/checkout",{cache:"no-store"});
    const d=await r.json();
    if(!r.ok || d.status!=="ok") throw new Error(d.message||"Flag evaluation failed");
    if(d.enabled){
      title.textContent="New Checkout Enabled";
      status.textContent="FLAG ON"; status.className="status on";
      document.getElementById("description").textContent="Flipt has enabled the new checkout experience.";
      document.getElementById("checkout").textContent="New checkout: review trip, enter traveler details, confirm booking.";
    }else{
      title.textContent="Classic Checkout";
      status.textContent="FLAG OFF"; status.className="status off";
      document.getElementById("description").textContent="Flipt has disabled the new checkout experience.";
      document.getElementById("checkout").textContent="Classic checkout: enter traveler details and confirm booking.";
    }
    document.getElementById("details").textContent=
      "Flag: "+d.flagKey+"\nEnvironment: "+d.environment+"\nNamespace: "+d.namespace;
  }catch(e){
    title.textContent="Could not evaluate flag";
    status.textContent="ERROR"; status.className="status error";
    document.getElementById("description").textContent="Check Flipt configuration and application logs.";
    document.getElementById("checkout").textContent="Checkout state is unavailable.";
    document.getElementById("details").textContent=e.message;
  }
}
evaluateFlag();
</script>
</body>
</html>
