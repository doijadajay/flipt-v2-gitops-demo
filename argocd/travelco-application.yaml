apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travelco-flipt-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/doijadajay/flipt-v2-gitops-demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: flipt-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
