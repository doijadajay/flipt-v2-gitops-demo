version: "1.6"
namespace: default
flags:
    - key: new-checkout
      name: new-checkout
      type: BOOLEAN_FLAG_TYPE
      description: Enable the new TravelCo checkout experience
      enabled: true
    - key: holiday-banner
      name: holiday-banner
      type: BOOLEAN_FLAG_TYPE
      description: Show a holiday discount banner in TravelCo
      enabled: true
    - key: holiday-destinations
      name: holiday-destinations
      type: BOOLEAN_FLAG_TYPE
      enabled: true
